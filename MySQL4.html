    <body bgcolor="pink">
        <h1 style="color:purple">¿Como crear una consulta en MySQL?</h1>
        <p>SELECT *FROM alumnos;</p>
        <p>SELECT:indica que inf. quieres consultar</p>
        <p>*:significa todas las columnas</p>
        <p>FROM:indica de que tabla se obtendran los datos</p>
        <p>ALUMNOS:nombre de la tabla</p>
    </body>
